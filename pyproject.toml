[project]
name = "llm-redteam-demo"
version = "0.1.0"
description = "Engineering-style LLM red-teaming demo (garak -> deepteam -> deepeval -> CI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "garak==0.17.0",
  "deepteam==1.0.9",
  "deepeval==4.2.8",
  "openai",
  "pyyaml",
  "python-dotenv",
  "numpy",
  "pytest",
  "torch",  # direct dep so the CPU-only index below applies (garak pulls torch transitively)
  "sentry-sdk>=2.72.0",
]

[tool.uv]
package = false

# garak needs torch only as an import; we call remote APIs, so CPU-only is enough.
# This avoids ~2.4 GB of CUDA wheels (nvidia-*, triton) on Linux.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
