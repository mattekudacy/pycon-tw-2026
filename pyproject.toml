[project]
name = "llm-redteam-demo"
version = "0.1.0"
description = "Engineering-style LLM red-teaming demo (garak -> deepteam -> deepeval -> CI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "garak==0.17.0",
  "deepteam==1.0.9",
  "deepeval==4.2.8",
  "openai",
  "pyyaml",
  "python-dotenv",
  "numpy",
  "pytest",
]

[tool.uv]
package = false
