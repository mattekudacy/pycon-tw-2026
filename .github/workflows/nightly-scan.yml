name: Nightly scan

# Slow and expensive: broad garak scan + full deepteam run. Never blocks a merge.
# Uploads the risk reports as workflow artifacts.
# MANUAL ONLY for now (Actions tab -> Nightly scan -> Run workflow, or `gh workflow run nightly-scan.yml`):
# a first run used ~2.5 h of runner time and a lot of model-API quota. To run it every night again,
# add back:  schedule:  - cron: "17 18 * * *"   # 02:17 Asia/Taipei
on:
  workflow_dispatch:
    inputs:
      include_slow_garak:
        description: "Also run the garak encoding and goodside families (slow, least tied to the talk)"
        type: boolean
        default: false

concurrency:
  group: nightly-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    # One garak job per family (redteam/garak_families.json), so a slow or hung family cannot
    # starve the rest and every family gets its own time limit and its own report.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          ALL: ${{ inputs.include_slow_garak }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          fams = json.load(open("redteam/garak_families.json"))
          if os.environ["ALL"] != "true":
              fams = [f for f in fams if f["default"]]
          print("matrix=" + json.dumps({"include": fams}, separators=(",", ":")))
          PY

  garak:
    # Runs after the deepteam jobs: everything shares one model-API rate limit.
    needs: [plan, deepteam]
    if: ${{ !cancelled() }}
    name: garak (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      LLM_BASE_URL: https://ollama.com/v1
      TARGET_MODEL: nemotron-3-nano:30b
      # A reply that spends 1500 tokens thinking counts as "no answer" (see docs/garak-coverage.md).
      REDTEAM_MAX_TOKENS: "1500"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: "garak ${{ matrix.family }} (chatbot only; garak sees text in, text out, nothing app-level)"
        continue-on-error: true
        run: |
          XDG_DATA_HOME="$PWD/reports" uv run garak --config redteam/garak_config_broad.yaml \
            --probes "${{ matrix.probes }}" --report_prefix "${{ matrix.family }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-garak-${{ matrix.family }}
          path: reports/garak/
          retention-days: 30

  deepteam:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [chatbot, rag_bot, agent_bot]
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      LLM_BASE_URL: https://ollama.com/v1
      TARGET_MODEL: nemotron-3-nano:30b
      SIMULATOR_MODEL: gemma4:31b
      JUDGE_MODEL: gpt-oss:120b # stronger judge nightly
      DEEPTEAM_TELEMETRY_OPT_OUT: "YES"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Full deepteam run
        continue-on-error: true
        run: uv run python -m redteam.deepteam_run --target ${{ matrix.target }} --full
      - name: Quality regressions (faithfulness / relevancy, LLM-judged)
        if: matrix.target == 'rag_bot'
        continue-on-error: true
        run: uv run pytest tests/regressions -m quality -q -p no:cacheprovider --junitxml=reports/junit-quality.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-deepteam-${{ matrix.target }}
          path: reports/
          retention-days: 30
