# Broad config: nightly. Never blocks merges.

plugins:
  target_type: function.Single
  target_name: redteam.garak_target#chatbot
system:
  parallel_attempts: 8
run:
  soft_probe_prompt_cap: 25   # cost control: nemotron takes ~10s/prompt and promptinject cannot run in parallel
  spec:
    include:
      - probes.promptinject
      - probes.dan
      - probes.goodside
      - probes.latentinjection
      - probes.encoding
      - probes.misleading
    exclude: []
  generations: 1
reporting:
  report_dir: runs
  report_prefix: broad
