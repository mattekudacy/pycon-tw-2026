# Broad config: nightly. Never blocks merges.

plugins:
  target_type: function.Single
  target_name: redteam.garak_target#chatbot
system:
  parallel_attempts: 8
run:
  seed: 42   # without a seed garak samples different prompts every run, so the response cache never hits
  soft_probe_prompt_cap: 15   # cost control. First nightly (cap 25, ran alongside other jobs) did 1161 attempts in 120 min and timed out before promptinject/latentinjection/misleading
  spec:
    include:
      - probes.promptinject
      - probes.dan
      - probes.goodside
      - probes.latentinjection
      - probes.encoding
      - probes.misleading
    exclude:
      - probes.dan.Ablation_Dan_11_0   # ignores the prompt cap: always 127 prompts
  generations: 1
reporting:
  report_dir: runs
  report_prefix: broad
